<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumma's Medicines</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0d9488" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24 font-sans">

  <!-- Header -->
  <header class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">Mumma's Medicines</h1>
      <p id="todayDate" class="text-teal-100 text-sm"></p>
    </div>
    <button id="enableNotifBtn" class="bg-white text-teal-700 font-semibold px-3 py-2 rounded-xl text-sm shadow active:scale-95">
      🔔 Alerts
    </button>
  </header>

  <!-- Main Medicine List -->
  <main class="max-w-lg mx-auto p-4 space-y-4">
    <div id="loading" class="text-center py-10 text-slate-500 text-lg">Loading medicines...</div>
    <div id="medList" class="space-y-4"></div>
  </main>

  <!-- Floating Add Button -->
  <button id="openModalBtn" class="fixed bottom-6 right-6 bg-teal-600 hover:bg-teal-700 text-white font-bold text-lg px-6 py-4 rounded-full shadow-xl flex items-center gap-2 active:scale-95">
    <span class="text-2xl leading-none">+</span> Add Medicine
  </button>

  <!-- Add / Edit Modal -->
  <div id="medModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 id="modalTitle" class="text-xl font-bold text-slate-800">Add Medicine</h2>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>

      <form id="medForm" class="space-y-4">
        <input type="hidden" id="medId" />

        <!-- Photo Capture / Upload -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Medicine Photo</label>
          <div class="flex items-center gap-4">
            <img id="photoPreview" src="https://placehold.co/120x120?text=No+Photo" class="w-24 h-24 rounded-xl object-cover border bg-slate-100" />
            <label class="flex-1 cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl text-center border border-slate-300">
              📷 Take / Pick Photo
              <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" />
            </label>
          </div>
        </div>

        <!-- Medicine Name -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Medicine Name</label>
          <input type="text" id="medName" required placeholder="e.g., Methotrexate 7.5mg"
            class="w-full border border-slate-300 rounded-xl p-3 text-lg focus:outline-teal-600" />
        </div>

        <!-- Dosage / Instructions -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Dosage & Instructions</label>
          <input type="text" id="medDosage" required placeholder="e.g., 1 tablet after breakfast"
            class="w-full border border-slate-300 rounded-xl p-3 text-lg focus:outline-teal-600" />
        </div>

        <!-- Time -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Reminder Time</label>
          <input type="time" id="medTime" required
            class="w-full border border-slate-300 rounded-xl p-3 text-lg focus:outline-teal-600" />
        </div>

        <!-- Days of Week -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Days to Take</label>
          <div class="grid grid-cols-7 gap-1 text-center" id="daysContainer">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" id="deleteMedBtn" class="hidden bg-red-100 text-red-700 font-semibold py-3 px-4 rounded-xl">
            Delete
          </button>
          <button type="submit" id="saveMedBtn" class="flex-1 bg-teal-600 text-white font-bold py-3 rounded-xl text-lg shadow">
            Save Medicine
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
